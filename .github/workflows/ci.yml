name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

  r-synth-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Libs de sistema exigidas na compilação de arrow/sf/s2/curl/igraph/
      # units/knitr (renv::restore() só instala os pacotes R, não isso).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake gdal-bin libabsl-dev libcurl4-openssl-dev libgdal-dev \
            libglpk-dev libudunits2-dev pandoc
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
      - uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: "."
      # Gerador sintético é 100% offline — roda sempre em CI, mesmo sem
      # acesso a DATASUS/INMET (pipeline real não é exercitado aqui).
      - run: Rscript pipelines/R/00_synth_data.R
      - run: Rscript pipelines/R/check_schema.R
      - run: |
          Rscript -e 'source("pipelines/R/catalog.R"); build_catalog("data/public")'
